version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: email_scheduler_postgres
    environment:
      POSTGRES_USER: vishwaksen
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: email_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: email_scheduler_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:

services:
  - type: web
    name: reachinbox-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: static
    name: reachinbox-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/.next
    routes:
      - type: rewrite
        source: /**
        destination: /index.html

databases:
  - name: reachinbox-db
    plan: free
    databaseName: email_scheduler
